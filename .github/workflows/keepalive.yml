name: Supabase keep-alive

# Supabase pauses a free-tier project after ~7 days of no database activity,
# which takes the live site down (every DB-backed route 500s) until a manual
# restore. This workflow hits the products API on a schedule; that request runs
# a real Prisma query against Postgres, which counts as activity and keeps the
# 7-day idle timer from ever firing.
#
# It also doubles as an uptime check: curl --fail turns any non-2xx into a red
# run, so a paused/broken site is surfaced instead of silently rotting.
#
# NOTE: this keeps an ACTIVE project active — it cannot wake an already-paused
# one. Restore Supabase manually once; after that this prevents recurrence.
# TODO: point at https://kashfedit.com/api/products once the domain is connected.

on:
  schedule:
    - cron: "0 9 */2 * *" # every 2 days at 09:00 UTC (well inside the 7-day window)
  workflow_dispatch: {} # allow manual runs from the Actions tab to verify it works

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the products API (real Prisma -> Postgres hit)
        run: |
          curl -sSf --retry 3 --retry-delay 15 \
            https://modest-filter.vercel.app/api/products > /dev/null
